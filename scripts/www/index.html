<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络测速与自动跳转</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 28px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        
        h1 {
            color: #2d3436;
            margin-bottom: 24px;
            font-size: 22px;
            font-weight: 700;
        }
        
        .countdown-bar {
            background: linear-gradient(45deg, #fdcb6e, #e17055);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 28px;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(231, 110, 85, 0.3);
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 28px;
        }
        
        .status-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }
        
        .status-title {
            font-size: 13px;
            color: #636e72;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .status-value {
            font-size: 16px;
            font-weight: 700;
            color: #2d3436;
        }
        
        .status-testing {
            color: #0984e3;
        }
        
        .status-success {
            color: #00b894;
        }
        
        .status-failed {
            color: #d63031;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 28px;
        }
        
        .access-btn {
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 17px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .access-btn.ipv4 {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            box-shadow: 0 6px 20px rgba(9, 132, 227, 0.4);
        }
        
        .access-btn.ipv6 {
            background: linear-gradient(135deg, #55efc4, #00b894);
            box-shadow: 0 6px 20px rgba(0, 184, 148, 0.4);
        }
        
        .access-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }
        
        .footer-text {
            font-size: 13px;
            color: #636e72;
            line-height: 1.6;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .progress-bar-fill {
            height: 100%;
            background-color: #3498db;
            border-radius: 2px;
            width: 0%;
            transition: width 0.2s ease;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .server-card {
                padding: 15px;
            }
            
            .server-name {
                font-size: 16px;
            }
            
            .server-url {
                font-size: 11px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 18px;
            }
            
            .server-list {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>选择最佳访问方式</h1>
        
        <div class="countdown-bar" id="countdownBar">测速中...（点击按钮可立即选择）</div>
        
        <div class="status-grid">
            <div class="status-card">
                <div class="status-title">IPv4 延迟</div>
                <div class="status-value status-testing" id="ipv4Status">检测中...</div>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="ipv4Progress"></div>
                </div>
            </div>
            
            <div class="status-card">
                <div class="status-title">IPv6 延迟</div>
                <div class="status-value status-testing" id="ipv6Status">检测中...</div>
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="ipv6Progress"></div>
                </div>
            </div>
        </div>
        
        <div class="button-group">
            <button class="access-btn ipv4" id="ipv4Btn" onclick="selectServer(0)">IPv4 访问</button>
            <button class="access-btn ipv6" id="ipv6Btn" onclick="selectServer(1)">IPv6 访问</button>
        </div>
        
        <div class="footer-text">
            网络卡顿会自动切换最优线路<br>
            手动点击按钮可立即跳转对应地址
        </div>

    <script>
        // 配置服务器地址
        const servers = [
            { name: 'IPv4', url: 'https://hsw.hexixi.cc', displayName: 'IPv4 服务器' },
            { name: 'IPv6', url: 'http://heshiwei.xin:6307', displayName: 'IPv6 服务器' }
        ];

        let testResults = [];
        let redirectTimer = null;

        // 更新服务器状态
        function updateServerStatus(index, status, latency = null) {
            const statusElement = document.getElementById(index === 0 ? 'ipv4Status' : 'ipv6Status');
            
            if (status === 'testing') {
                statusElement.className = 'status-value status-testing';
                statusElement.textContent = '检测中...';
            } else if (status === 'success') {
                statusElement.className = 'status-value status-success';
                statusElement.textContent = `${Math.round(latency)}ms`;
            } else if (status === 'failed') {
                statusElement.className = 'status-value status-failed';
                statusElement.textContent = '连接失败';
            }
        }

        // 更新进度条
        function updateProgressBar(index, progress) {
            const progressBar = document.getElementById(index === 0 ? 'ipv4Progress' : 'ipv6Progress');
            progressBar.style.width = `${progress}%`;
        }

        // 测试函数
        async function testServer(server, index) {
            updateServerStatus(index, 'testing');
            
            // 模拟进度条动画
            let progress = 0;
            const progressInterval = setInterval(() => {
                progress += 5;
                updateProgressBar(index, Math.min(progress, 90));
                if (progress >= 90) {
                    clearInterval(progressInterval);
                }
            }, 100);

            const startTime = performance.now();
            try {
                // 设置3秒超时
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);
                
                const response = await fetch(server.url, {
                    method: 'HEAD',
                    mode: 'no-cors',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                const endTime = performance.now();
                const latency = endTime - startTime;
                
                clearInterval(progressInterval);
                updateProgressBar(index, 100);
                updateServerStatus(index, 'success', latency);
                
                return { ...server, latency, error: null };
            } catch (error) {
                clearInterval(progressInterval);
                updateProgressBar(index, 100);
                updateServerStatus(index, 'failed');
                
                return { ...server, latency: Infinity, error: error.message };
            }
        }

        // 手动选择服务器
        function selectServer(index) {
            if (redirectTimer) {
                clearInterval(redirectTimer);
            }
            // 使用replace防止用户返回测速页面
            window.location.replace(servers[index].url);
        }

        // 显示倒计时
        function showCountdown() {
            let seconds = 2;
            const countdownBar = document.getElementById('countdownBar');
            
            countdownBar.textContent = `${seconds}秒后自动选择最佳线路（点击按钮可取消）`;
            
            redirectTimer = setInterval(() => {
                seconds--;
                countdownBar.textContent = `${seconds}秒后自动选择最佳线路（点击按钮可取消）`;
                
                if (seconds <= 0) {
                    clearInterval(redirectTimer);
                    // 自动选择延迟最低的服务器
                    const fastestServer = testResults.reduce((best, current) => 
                        current.latency < best.latency ? current : best
                    );
                    if (fastestServer.latency < Infinity) {
                        // 使用replace防止用户返回测速页面
                        window.location.replace(fastestServer.url);
                    }
                }
            }, 1000);
        }

        // 主函数
        async function runSpeedTest() {
            testResults = await Promise.all(servers.map((server, index) => testServer(server, index)));
            
            // 启动倒计时
            const fastestServer = testResults.reduce((best, current) => 
                current.latency < best.latency ? current : best
            );
            
            if (fastestServer.latency < Infinity) {
                showCountdown();
            }
        }

        // 页面加载后开始测试
        window.onload = runSpeedTest;
    </script>
</body>
</html>
