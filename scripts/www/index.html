<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>访问方式选择</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;background:#f5f5f5;font-family:system-ui, -apple-system, sans-serif}
        .container{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100%;padding:20px}
        .box{width:100%;max-width:360px;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
        h2{text-align:center;margin-bottom:20px;color:#1d2129;font-size:20px}
        .countdown{text-align:center;margin:10px 0;font-size:15px;color:#ff7d00;font-weight:500}
        .speed-info{text-align:center;margin:8px 0;font-size:14px;color:#4e5969}
        .alert{background:#fff7e6;color:#d48806;padding:12px;border-radius:8px;margin:12px 0;text-align:center;font-size:14px}
        .btn{display:block;width:100%;padding:18px;margin:15px 0;border:none;border-radius:12px;font-size:17px;font-weight:500;cursor:pointer;transition:all 0.2s}
        .btn:active{transform:scale(0.98)}
        .btn-ipv4{background:#1677ff;color:white}
        .btn-ipv6{background:#00b42a;color:white}
        .tip{text-align:center;margin-top:20px;font-size:14px;color:#86909c}
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h2>选择访问方式</h2>
            <div class="countdown" id="countdown">3秒后自动进入IPv4（点击按钮可取消）</div>
            <div class="speed-info" id="speedInfo">正在检测网络速度...</div>
            <div id="alertBox"></div>
            <button class="btn btn-ipv4" onclick="goIPv4(true)">IPv4 访问（优先）</button>
            <button class="btn btn-ipv6" onclick="goIPv6(true)">IPv6 访问（网络卡时用）</button>
            <p class="tip">网络卡顿请切换为 IPv6 访问</p>
        </div>
    </div>

    <script>
        // 你的最新地址
        const IPV4_URL = "http://8.137.162.29:6307/";
        const IPV6_URL = "http://heshiwei.xin:6307/";
        const MAX_DELAY = 300; // IPv4延迟阈值
        const COUNTDOWN_TIME = 3000; // 3秒自动跳转
        let countdownTimer; // 倒计时定时器
        let autoJumpTimer; // 自动跳转定时器

        // 初始化倒计时
        function initCountdown() {
            let remaining = 3;
            const countdownEl = document.getElementById('countdown');
            countdownTimer = setInterval(() => {
                remaining--;
                if (remaining > 0) {
                    countdownEl.textContent = `${remaining}秒后自动进入IPv4（点击按钮可取消）`;
                } else {
                    clearInterval(countdownTimer);
                    countdownEl.textContent = "即将自动进入IPv4...";
                    goIPv4(false); // 自动跳转（不清除定时器，因为倒计时已结束）
                }
            }, 1000);
        }

        // 跳转函数（isManual：是否手动点击）
        function goIPv4(isManual) {
            // 清除所有定时器（手动点击时取消自动跳转）
            if (isManual) {
                clearInterval(countdownTimer);
                clearTimeout(autoJumpTimer);
                document.getElementById('countdown').textContent = "已选择IPv4访问";
            }
            window.open(IPV4_URL, '_top');
        }
        function goIPv6(isManual) {
            // 清除所有定时器（手动点击时取消自动跳转）
            if (isManual) {
                clearInterval(countdownTimer);
                clearTimeout(autoJumpTimer);
                document.getElementById('countdown').textContent = "已选择IPv6访问";
            }
            window.open(IPV6_URL, '_top');
        }

        // 测速函数
        async function testSpeed(url) {
            const start = Date.now();
            try {
                await fetch(url, { method: 'HEAD', mode: 'no-cors' });
                return Date.now() - start;
            } catch (e) {
                return Infinity;
            }
        }

        // 页面加载后执行
        window.onload = async function () {
            // 启动3秒倒计时
            initCountdown();
            
            // 测速并提示
            const ipv4Delay = await testSpeed(IPV4_URL);
            const speedInfo = document.getElementById('speedInfo');
            const alertBox = document.getElementById('alertBox');

            if (ipv4Delay === Infinity) {
                speedInfo.textContent = "IPv4 访问失败，建议手动选择IPv6";
                alertBox.innerHTML = '<div class="alert">⚠️ IPv4 网络异常，建议切换到 IPv6</div>';
                // IPv4访问失败时，取消自动跳转
                clearInterval(countdownTimer);
                clearTimeout(autoJumpTimer);
                document.getElementById('countdown').textContent = "IPv4不可用，请手动选择IPv6";
            } else if (ipv4Delay > MAX_DELAY) {
                speedInfo.textContent = `IPv4 延迟：${ipv4Delay}ms（较慢），建议手动选择IPv6`;
                alertBox.innerHTML = '<div class="alert">⚠️ 当前网络较慢，建议切换到 IPv6</div>';
            } else {
                speedInfo.textContent = `IPv4 延迟：${ipv4Delay}ms（正常）`;
                // 延迟正常，3秒后自动跳转（和倒计时联动）
                autoJumpTimer = setTimeout(goIPv4, COUNTDOWN_TIME);
            }
        };
    </script>
</body>
</html>
